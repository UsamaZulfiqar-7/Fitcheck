services:
  minio:
    image: quay.io/minio/aistor/minio:latest
    command: server /mnt/data --console-address ":9001" --license /minio.license
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - fitcheck_minio_data:/mnt/data
      - ./.local/minio/minio.license:/minio.license:ro

volumes:
  fitcheck_minio_data:
